# Rebuilds the plugin pages from Modrinth: every day, on every push, and on demand (Actions tab → Run workflow).
name: Build plugin pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "*/index.html"
      - "data.js"
      - "sitemap.xml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown-it-py
      - run: python scripts/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Rebuild plugin pages from Modrinth"
            git push
          fi
